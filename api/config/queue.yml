default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 100
  workers:
    - queues:
        - default
        - solid_queue_recurring
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
