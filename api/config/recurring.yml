production:
  reconcile_notification_deliveries:
    class: NotificationDeliveryReconciliationJob
    schedule: every 5 minutes
    description: Recover interrupted sends and re-enqueue orphaned deliveries
  reconcile_account_deletions:
    class: AccountDeletionReconciliationJob
    schedule: every 5 minutes
    description: Recover interrupted account deletions and retry durable provider requests
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
